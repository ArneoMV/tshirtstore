openapi: "3.1.0"
info:
  title: Tshirt store API
  description: LCO - A course to create ecomn API
  version: 1.0.1
  contact:
    email: arneo@gmail.com
    url: "https://lco.dev"

## servers
# - url: "https://localhost:4000/api/v1"
#   description: for localhost - secure
# - url:  "https://localhost:4000/api/v1"
#   description:  for localhost - regular

servers:
  - url: "{protocol}://localhost:4000/api/{version}"
    description: Localhost server
    variables:
      version:
        enum:
          - v1
          - v2
        default: v1
      protocol:
        enum:
          - http
          - https
        default: http

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

paths:
  /dummy:
    get:
      tags:
        - Home
      summary: Returns a greeting message from LCO
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: string
                example: "mystring"
        400:
          description: Bad Request
        500:
          description: Internal Server Error
